<!DOCTYPE html>
<html lang="eng">
<html>
<head>
    <meta charset="UTF-8">
    <title>Scientific Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>
    <body>
        <div class="container">
            <div class="display">
                <input id="screen" type="text" placeholder="0">
            </div>

            <div class="btns">
                <div class="row">
                    <button id="ce"onclick="backspc()">CE</button>
                    <button onclick="fact()">X!</button>
                    <button class="btn">(</button>
                    <button class="btn">)</button>
                    <button class="btn">%</button>
                    <button id="ac" onclick="screen.value=''">AC</button>
                </div>
                <div class="row">
                    <button onclick="sin()">sin</button>
                    <button onclick="screen.value=Math.PI">π</button>
                    <button class="btn">7</button>
                    <button class="btn">8</button>
                    <button class="btn">9</button>
                    <button class="btn">÷</button>
                </div>
                <div class="row">
                    <button onclick="cos()">cos</button>
                    <button onclick="log()">log</button>
                    <button class="btn">4</button>
                    <button class="btn">5</button>
                    <button class="btn">6</button>
                    <button class="btn">X</button>
                </div>
                <div class="row">
                    <button onclick="tan()">tan</button>
                    <button onclick="sqrt()">√</button>
                    <button class="btn">1</button>
                    <button class="btn">2</button>
                    <button class="btn">3</button>
                    <button class="btn">-</button>
                </div>
                <div class="row">
                    <button onclick="e()">e</button>
                    <button onclick="pow()">x <span style="position: relative; bottom: .4em; right: .1em;">y</span></button>
                    <button class="btn">0</button>
                    <button class="btn">.</button>
                    <button id="eval"onclick="try{screen.value=eval(screen.value);}catch(error){ screen.value = 'Error'; }">=</button>
                    <button class="btn">+</button>
                </div>
            </div>
        </div>
     
    <script>
        var screen=document.querySelector("#screen");
        var btn=document.querySelectorAll(".btn");

        for(item of btn)
        {
            item.addEventListener('click',(e)=>{
                btnText=e.target.innerText;
                if(btnText=='X')
                {
                    btnText='*';
                }
                if(btnText=='÷')
                {
                    btnText='/';
                }
                screen.value+=btnText;
            });
        }
        
        function clearScreen()
        {
            screen.value="";
        }

        function sin()
        {
            screen.value=Math.sin(screen.value);
        }
        function cos()
        {
            screen.value=Math.cos(screen.value);
        }
        function tan()
        {
            screen.value=Math.tan(screen.value);
        }
        function log()
        {
            screen.value=Math.log(screen.value);
        }
        function pow()
        {
            screen.value=Math.pow(screen.value,2);
        }
        function sqrt()
        {
            screen.value=Math.sqrt(screen.value,2);
        }
        function e()
        {
            screen.value=Math.E;
        }
        function fact()
        {
            var i, num, f;
            f=1;
            num=screen.value;
            for(i=1;i<=num;i++)
            {
                f=f*i;
            }
            i=i-1;
            screen.value=f;
        }
        function backspc()
        {
            screen.value=screen.value.substr(0,screen.value.length-1);
        }
    </script>
    <script src="js.js"></script>
    </body>

</html>
